name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/git-branch-practice

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Documentation
        run: |
          echo "Starting CI validation..."
          test -f README.md
          echo "README.md exists"
          echo "CI validation successful!"